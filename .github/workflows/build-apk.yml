name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed site URL (https://...)"
        default: "https://zsh-nmt-attendance.manus.space"
        required: true
      app_name:
        description: "App name on the phone"
        default: "SmartCheck"
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ inputs.app_url }}
      APP_NAME: ${{ inputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: node scripts/patch-android.mjs
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: smartcheck-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
